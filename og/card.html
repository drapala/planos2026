<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f4f2ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242a29;display:flex;align-items:stretch}
.wrap{flex:1;margin:40px;border-radius:36px;background:#fffefa;border:2px solid #dcded6;padding:52px 64px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:18px;font-weight:700;font-size:30px;color:#245f50}
.mark{width:58px;height:58px;border-radius:50%;background:#245f50;color:#f4f2ed;display:grid;place-items:center;font-size:36px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:80px;line-height:1.05;letter-spacing:-2px;margin:10px 0 6px}
.sub{font-size:30px;color:#5d645f;line-height:1.3}
.row{display:flex;gap:16px}
.pill{border:2px solid #dcded6;border-radius:999px;padding:10px 22px;font-size:25px;font-weight:600;white-space:nowrap}
.pill.a{background:#e9efe8;border-color:#245f50;color:#245f50}
</style></head><body><div class="wrap">
<div class="top"><span class="mark">↗</span>planos2026.com.br</div>
<h1>Qual candidato pensa<br>parecido com você?</h1>
<div class="sub">9 perguntas tiradas dos planos de governo de 2026.<br>Os nomes só aparecem no final.</div>
<div class="row"><span class="pill a">✅ o que você ganha</span><span class="pill">⚠️ o que você perde</span><span class="pill">5 min · sem cadastro</span></div>
</div></body></html>
