<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161c1b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Explore escolhas difíceis, entenda suas prioridades e compare propostas com os autores ocultos até você decidir revelá-los.">
  <title>Entre escolhas — planos anônimos</title>
  <style>:root{color-scheme:light dark;--bg:#f4f2ed;--card:#fffefa;--ink:#242a29;--muted:#5d645f;--line:#dcded6;--accent:#245f50;--soft:#e9efe8;--warm:#855335;--warm-soft:#f4ece3;--focus:#265dcc;--pad:16px;--radius:16px;--safe-b:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#161c1b;--card:#1e2725;--ink:#edf1e9;--muted:#b2beb6;--line:#3c4b44;--accent:#b9d8b8;--soft:#2c3e33;--warm:#e4bc99;--warm-soft:#3b3028;--focus:#a7c6ff}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit}
button,a,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
a{color:var(--accent);text-underline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:400;line-height:1.15;letter-spacing:-.03em}
h2{font-size:1.3rem;line-height:1.25;letter-spacing:-.02em}
h3{font-size:1.05rem;line-height:1.4}
p+p{margin-top:12px}

/* estrutura */
.site-header,main{max-width:1060px;margin:auto}
.site-header{display:flex;align-items:center;gap:10px;padding:14px var(--pad);padding-top:max(14px,env(safe-area-inset-top));font-weight:650;font-size:1rem}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:1.4rem;display:grid;place-items:center;flex:none}
.brand-sub{display:block;font-size:.6rem;letter-spacing:.14em;color:var(--muted)}
main{padding:4px var(--pad) calc(32px + var(--safe-b));min-height:70vh}
.eyebrow{color:var(--accent);font-size:.72rem;letter-spacing:.1em;font-weight:750;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.lead{font-size:1.05rem;color:var(--muted);max-width:64ch;margin-top:16px}
.card{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.stack>*+*{margin-top:16px}
.top-space{margin-top:18px}

/* botões */
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 18px;background:var(--card);text-decoration:none;font-weight:600;font-size:.95rem;text-align:center}
.button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.button.quiet{background:transparent}
.button.small-button{padding:7px 12px;min-height:44px;font-size:.85rem}
.actions{display:flex;flex-direction:column;gap:10px}
.actions>.button,.actions>a{width:100%}
.pill{border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--card);font-size:.9rem;min-height:48px}
.pill[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}

/* abertura */
.hero{padding:24px 20px}
.hero h1{margin-top:14px}
.hero-layout{display:grid;gap:24px}
.intro-preview{display:none;padding:24px;background:var(--soft);border-radius:18px;transform:rotate(2deg)}
.intro-preview .quote{font:1.6rem/1.25 Georgia,serif;margin:14px 0}
.mini-choice{border-top:1px solid var(--line);padding:12px 0;font-size:.92rem}
.mini-choice b{display:block}
.intro-grid{display:grid;gap:14px;margin:24px 0}
.intro-grid b{display:block;margin-bottom:4px}
.intro-grid p{font-size:.92rem;color:var(--muted)}

/* pergunta */
.step-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted)}
.progress{height:5px;border-radius:3px;background:var(--line);margin:10px 0 18px;overflow:hidden}
.progress div{height:100%;background:var(--accent)}
.question-head h1{font-size:1.75rem;margin:10px 0 14px}
.scenario-notice{display:block;width:fit-content;margin-top:8px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.context{max-width:70ch}
.constraint{margin-top:14px;padding:12px 14px;border-left:3px solid var(--warm);background:var(--warm-soft);border-radius:0 10px 10px 0;font-size:.95rem}
.changed{margin:14px 0;padding:14px;border:1px dashed var(--accent);border-radius:12px;background:var(--soft)}
.question-prompt{font-weight:650;font-size:1.05rem;margin:20px 0 12px}
.choices{display:grid;gap:12px}
.choice{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);text-align:left;padding:18px 16px;display:flex;flex-direction:column;gap:12px;transition:border-color .12s,background .12s}
.choice.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.choice-top{display:flex;align-items:flex-start;gap:12px}
.choice-letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border:1px solid var(--line);border-radius:50%;font-size:.8rem;font-weight:700}
.selected .choice-letter{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.choice-title{font-weight:650;line-height:1.35;font-size:1.05rem;padding-top:2px}
.choice-action{font-size:.98rem}
.tradeoff{padding-top:10px;border-top:1px solid var(--line);font-size:.95rem}
.tradeoff.cost{margin-top:auto}
.tradeoff-label{display:block;color:var(--accent);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:750;margin-bottom:4px}
.tradeoff.cost .tradeoff-label{color:var(--warm)}
fieldset{border:0;padding:0;margin:0}
legend{padding:0;font-size:.92rem;font-weight:600}
.confidence{margin-top:16px;padding:4px 0}
.confidence .actions{flex-direction:row;margin-top:10px}
.confidence .pill{flex:1}
.uncertainty{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.answer-help{min-height:24px;color:var(--muted);font-size:.88rem;margin-top:10px}
.nav{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;margin:18px calc(-1 * var(--pad)) 0;padding:12px var(--pad) calc(12px + var(--safe-b));background:var(--bg);border-top:1px solid var(--line)}
.nav .button{flex:1}
.nav .button.primary{flex:2}

/* resultado */
.result-hero h1{margin-top:12px;font-size:1.9rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;border-top:1px solid var(--line);padding-top:18px;margin-top:20px}
.stat strong{font:1.8rem/1.2 Georgia,serif;display:block}
.stat span{font-size:.82rem;color:var(--muted)}
.section-head{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.section-head h2+p{margin-top:8px}
.section-head>.button{align-self:flex-start}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.72rem;color:var(--muted);font-weight:500}
.badge.accent{background:var(--soft);border-color:var(--soft);color:var(--accent)}
.badge.warm{background:var(--warm-soft);border-color:var(--warm-soft);color:var(--warm)}
.ranking{display:grid;gap:10px}
.rank-card{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:0 16px}
.rank-card.leading{border-color:var(--accent);background:var(--soft)}
.rank-top{grid-column:1/3;display:flex;justify-content:space-between;gap:8px;align-items:center}
.plan-letter{font:1.4rem Georgia,serif}
.plan-name{font-weight:650;margin-top:8px;font-size:1rem}
.rank-number{grid-column:2;grid-row:2/4;align-self:center;font:2.4rem/1.1 Georgia,serif;margin:6px 0}
.rank-number small{font-size:1.1rem}
.rank-card .meter,.rank-card .small{grid-column:1/3}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 10px}
.meter>span{display:block;height:100%;background:var(--accent)}
.notice{padding:14px 16px;background:var(--soft);border-radius:12px;font-size:.92rem}
.notice p+p{margin-top:8px}
.filterbar{display:flex;gap:8px;margin:16px calc(-1 * 20px);padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.filterbar .pill{flex:none}
.response-list{display:grid;gap:8px}
.response-row{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.response-row summary{cursor:pointer;padding:14px 12px;min-height:56px;display:flex;align-items:center;gap:10px;list-style:none}
.response-row summary::-webkit-details-marker{display:none}
.response-row summary:after{content:'+';margin-left:auto;flex:none;font-size:1.4rem;color:var(--muted)}
.response-row[open] summary:after{content:'−'}
.row-index{color:var(--muted);font-size:.72rem;min-width:22px}
.row-title{font-size:.95rem;font-weight:650}
.row-subtitle{display:block;font-size:.84rem;font-weight:400;color:var(--muted);margin-top:2px}
.response-content{padding:0 12px 16px}
.your-choice{padding:14px;background:var(--soft);border-radius:10px;font-size:.92rem}
.your-choice strong{display:block;margin-bottom:5px}
.positions{display:grid;gap:8px;margin-top:14px}
.position{border:1px solid var(--line);border-radius:10px;padding:14px;font-size:.9rem}
.position strong{display:block;margin:8px 0 4px}
.position p{color:var(--muted);margin-bottom:10px}
.position .button{width:100%}
.scenario-grid{display:grid;gap:12px}
.value-card{border:1px solid var(--line);border-radius:14px;padding:16px}
.value-card h3{margin:8px 0 10px}
.value-card .priority{font:1.2rem/1.4 Georgia,serif;color:var(--accent);margin:10px 0}
.value-card .accepted-cost{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font-size:.9rem;color:var(--muted)}
.variation{background:var(--soft);border-radius:10px;padding:12px;margin-top:14px;font-size:.88rem}
.method{font-size:.92rem;color:var(--muted)}
.method summary{cursor:pointer;font-weight:650;color:var(--ink);min-height:44px;display:flex;align-items:center}
.method ol{padding-left:20px}
.method li+li{margin-top:8px}
.method p{margin-top:12px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.pending-list{display:grid;gap:8px;margin:18px 0}
.pending-list .button{justify-content:space-between;text-align:left}
.copy-area{width:100%;min-height:150px;background:var(--card);color:var(--ink);padding:14px;border:1px solid var(--line);border-radius:10px}
.copy-feedback{font-size:.88rem;color:var(--accent);margin-top:10px}

/* janela da fonte: folha de baixo no celular */
dialog{color:var(--ink);background:var(--card);border:1px solid var(--line);padding:20px var(--pad) calc(20px + var(--safe-b));width:100%;max-width:100%;max-height:88vh;margin:auto 0 0;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0003;overflow-y:auto}
dialog::backdrop{background:#10191499;backdrop-filter:blur(3px)}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.dialog-head h2{font-size:1.2rem}
.source-quote{font:1.1rem/1.6 Georgia,serif;padding:16px;margin:16px 0;background:var(--soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0}
.source-text{font:.85rem/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:14px;border-radius:8px;margin-top:12px}
.source-meta{font-size:.8rem;color:var(--muted)}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,main:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-100px;left:12px;padding:10px;background:var(--card);z-index:10}
.skip-link:focus{top:10px}
.noscript{padding:24px;max-width:800px;margin:auto}

/* tablet */
@media(min-width:640px){
  :root{--pad:24px;--radius:20px}
  h1{font-size:2.6rem}
  h2{font-size:1.6rem}
  .site-header{padding:22px var(--pad)}
  .card{padding:28px}
  .hero{padding:36px}
  .actions{flex-direction:row;flex-wrap:wrap;align-items:center}
  .actions>.button,.actions>a{width:auto}
  .intro-grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .question-head h1{font-size:2.2rem}
  .scenario-notice{display:inline-block;margin:0 0 0 8px}
  .choices{grid-template-columns:1fr 1fr;gap:16px}
  .choice{padding:22px}
  .choice:hover{border-color:var(--accent)}
  .uncertainty{display:flex;flex-wrap:wrap}
  .confidence .pill{flex:none}
  .nav{position:static;margin:22px 0 0;padding:20px 0 0;background:none}
  .nav .button,.nav .button.primary{flex:none}
  .nav{justify-content:space-between}
  .stats{grid-template-columns:repeat(4,1fr)}
  .section-head{flex-direction:row;align-items:flex-start;justify-content:space-between}
  .section-head>.button{flex:none}
  .filterbar{flex-wrap:wrap;overflow:visible;margin:20px 0;padding:0}
  .positions{grid-template-columns:repeat(3,1fr)}
  .scenario-grid{grid-template-columns:1fr 1fr}
  .response-row summary{padding:16px 18px;gap:14px}
  .response-content{padding:0 20px 22px}
  dialog{width:calc(100% - 48px);max-width:720px;margin:auto;border-radius:20px;padding:28px}
}

/* desktop */
@media(min-width:920px){
  h1{font-size:3.6rem}
  .hero{padding:46px}
  .hero h1{max-width:13ch}
  .hero-layout{grid-template-columns:1.15fr .85fr;gap:46px;align-items:center}
  .intro-preview{display:block}
  .question-head h1{font-size:2.6rem;max-width:28ch}
  .result-hero h1{font-size:3rem;max-width:22ch}
  .ranking{grid-template-columns:repeat(3,1fr);gap:14px}
  .rank-card{display:block;padding:20px}
  .rank-number{font-size:2.9rem;margin:14px 0 3px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

 fiscais, com\nregras claras focadas na estabilização e na redução da dívida pública\nconforme determina a Constituição. Vamos construir o equilíbrio fiscal\nduradouro, entregando superávits primários e limitando o crédito subsidiado\ncom recursos do Tesouro, mitigando pressões inflacionárias. E haverá uma\nregra clara de controle de gastos discricionários dos três Poderes da União.", "page": 71}, "reason": "Propõe reformular as regras atuais. Isso não equivale a atribuir a ele a mesma reforma detalhada de outro texto."}, "renan": {"status": "explicit", "side": "a", "quote": "Essas propostas já deverão estar presentes no nosso projeto de PEC de Transição, que terá por objetivo substituir o arcabouço fiscal por um novo modelo mais inteligente.", "source": {"file": "renan.txt", "start": 395, "end": 397, "excerpt": "do superávit financeiro, a reforma do funcionalismo público com fim dos supersalários, mudanças nas emendas parlamentares, redução das isenções fiscais e uma nova lei complementar das finanças públicas. Essas\npropostas já deverão estar presentes no nosso projeto de PEC de Transição, que terá por objetivo substituir o\narcabouço fiscal por um novo modelo mais inteligente.", "page": 10}, "reason": "Propõe substituir o arcabouço; esta pergunta compara apenas mudança ou manutenção da regra."}}}, {"id": "p_renda", "kind": "proposal", "theme": "Ajuda do governo", "title": "Dinheiro mensal ou vaga de trabalho?", "context": "Hoje o governo federal paga um dinheiro mensal a famílias pobres. Uma proposta troca esse dinheiro por trabalho pago em serviços públicos para quem tem idade de trabalhar.", "constraint": "O trabalho pago liga a ajuda a uma tarefa. Mas isso só funciona se houver vagas suficientes perto de quem precisa.", "question": "Que tipo de ajuda você prefere para quem tem idade de trabalhar?", "options": {"a": {"title": "Trabalho pago pelo governo", "action": "O governo troca o dinheiro mensal por vagas de trabalho pago em serviços públicos, para quem te edir que\nelas difundam desinformação, acolham campanhas de ódio e outras formas de\ncomunicação nocivas para a democracia. Nenhuma democracia sobrevive sem\numa opinião pública plural e sem a garantia plena da liberdade de expressão.", "page": 16}, "reason": "Defende expressamente avançar na regulação das redes para combater desinformação e campanhas de ódio."}, "flavio": {"status": "mixed", "side": null, "quote": "Vamos fazer um Tesouraço da Censura: acabar com qualquer estrutura estatal que funcione como um “Ministério da Verdade\", encarregada de vigiar, rotular ou punir o que as pessoas dizem.", "source": {"file": "flavio.txt", "start": 2560, "end": 2563, "excerpt": "Vamos fazer um Tesouraço da Censura: acabar com qualquer estrutura estatal\nque funcione como um “Ministério da Verdade\", encarregada de vigiar, rotular\nou punir o que as pessoas dizem. E vamos revogar todos os atos que o atual\ngoverno produziu para silenciar seus críticos, para que a censura já praticada", "page": 66}, "reason": "A proposta combate estruturas descritas como censura. Isso não prova rejeição a toda nova regra para plataformas."}, "renan": {"status": "mixed", "side": null, "quote": "6 Oposição firme a quaisquer propostas de regulação da mídia e da internet que reduzam a margem de liberdade de expressão no Brasil, sem descurar da necessidade de discutir um novo código de imprensa, em lugar da lei reguladora da imprensa que não foi recepcionada pela Constituição Federal de 1988.", "source": {"file": "renan.txt", "start": 1065, "end": 1067, "excerpt": "6 Oposição firme a quaisquer propostas de regulação da mídia e da internet que reduzam a margem de\n\nliberdade de expressão no Brasil, sem descurar da necessidade de discutir um novo código de imprensa, em lugar da lei reguladora da imprensa que não foi recepcionada pela Constituição Federal de 1988.", "page": 29}, "reason": "Rejeita regulação que reduza a liberdade de expressão e propõe discutir um código de imprensa; não resolve a e function setConfidence(value) {
  if (screen !== 'question' || !['lean','strong'].includes(value) || !QuizCore.decided(resp[DATA.items[idx].id])) return;
  resp[DATA.items[idx].id].confidence = value;
  question(); app.querySelector?.(`[data-confidence="${value}"]`)?.focus?.({preventScroll:true});
}
let editOriginal = null;
function editQuestion(id) {
  const i = DATA.items.findIndex(item => item.id === id);
  if (i < 0) return;
  editOriginal = resp[id] ? {...resp[id]} : null;
  editing = true; screen = 'result'; go(i);
}
function cancelEdit() {
  const id = DATA.items[idx].id;
  if (editOriginal) resp[id] = editOriginal; else delete resp[id];
  editing = false; result();
}
function pending(summary) {
  screen = 'pending';
  app.innerHTML = `<section class="card"><p class="eyebrow">Falta pouco</p><h1 tabindex="-1" class="top-space">Há perguntas pendentes.</h1><p class="lead">${summary.missing.length} de ${DATA.items.length} perguntas ainda estão sem resposta. Se não souber, toque em "Não consigo escolher".</p><div class="pending-list">${summary.missing.map(id=>{const i=findItem(id);return button(`${esc(i.title)} <span aria-hidden="true">→</span>`, 'edit', `data-id="${i.id}"`);}).join('')}</div><p class="small muted">Suas outras respostas continuam salvas nesta página.</p></section>`;
  focusMain();
}
function valueCard(base) {
  const answer = resp[base.id], chosen = QuizCore.decided(answer) ? base.options[answer.choice] : null;
  const variant = DATA.items.find(i => i.baseId === base.id);
  let variation = '';
  if (variant) {
    const state = QuizCore.variation(variant, resp);
    const text = {changed:'Você mudou de ideia',kept:'Você manteve a mesma escolha',resolved:'Com a mudança, você conseguiu escolher',open:'Com a mudança, você ficou sem escolher'}[state];
    variation = `<div class="variation"><b>${text}.</b><p>${esc(variant.change)}</p><p>Nova resposta: ${esc(answerLabel(variant, resp[variant.id]))}.</p>${button('Ver a pergunta com a mudança','edit',`data-id="${variant.id}"`)}</div>`;
  }
  return `<article class="value-card"><p class="eyebrow">${esc(base.theme)}</p><h3>${esc(base.title)}</h3>${chosen ? `<span class="badge">${confidenceLabel(answer)}</span><p class="priority">${esc(chosen.value)}</p><p class="small">${esc(chosen.action)}</p><p class="accepted-cost"><b>O que você aceitou perder:</b> ${esc(chosen.cost)}</p>` : `<p class="priority">${esc(answerLabel(base, answer))}</p><p class="small muted">Você não escolheu um lado aqui.</p>`}${variation}<div class="top-space">${button('Mudar resposta','edit',`data-id="${base.id}"`)}</div></article>`;
}
function leaderHeadline(comp) {
  if (!comp.sufficient) return { title: 'Ainda falta base para mostrar um candidato.', text: `Para cada candidato, você precisa escolher A ou B em pelo menos ${comp.minBase} perguntas em que o plano dele tem posição clara. Mude algumas respostas "Não consigo escolher".` };
  const names = comp.leaders.map(k => esc(planName(candidate(k))));
  const top = comp.ranking[0];
  if (comp.leaders.length > 1) return { title: `Empate: ${names.join(' e ')}.`, text: `Eles combinam com você na mesma medida: ${top.percent}%.` };
  return { title: `Quem mais combina com você: ${names[0]}.`, text: `Vocês escolheram o mesmo lado em ${top.matches} de ${top.total} perguntas em que o plano dele tem posição clara.` };
}
function comparisonPanel(comp) {
  const head = leaderHeadline(comp);
  const ranking = comp.sufficient ? `<div class="ranking">${comp.ranking.map(r=>{
    const c=candidate(r.key), leading=comp.leaders.includes(c.key);
    return `<article class="rank-card${leading?' leading':''}"><div class="rank-top"><span class="plan-letter">${c.code}</span>${leading?`<span class="badge accent">${comp.leaders.length>1?'Empate':'Mais parecido com você'}</span>`:''}</div><p class="plan-name">${esc(planName(c))}</p><p class="rank-number">${r.percent}<small>%</small></p><p class="small muted">${r.matches} de ${r.total} perguntas com a mesma escolha</p><div class="meter" aria-hidden="true"><span style="width:${r.percent}%"></span></div><p class="small">${r.values.total ? `Propostas: ${r.proposals.matches} de ${r.proposals.total} · Valores: ${r.values.matches} de ${r.values.total}` : `${r.proposals.total} propostas comparadas`}</p></article>`;
  }).join('')}</div>` : `<div class="empty">${head.text}</div>`;
  return `<section class="card" id="planos" aria-labelledby="comparison-title"><div class="section-head"><div><p class="eyebrow">Candidatos</p><h2 id="comparison-title" tabindex="-1" class="top-space">${comp.sufficient ? 'Os três candidatos' : head.title}</h2><p class="small muted">A conta usa as perguntas em que o plano tem posição clara. Cada posição vem com o trecho do plano.</p></div>${button(revealed?'Ocultar nomes':'Mostrar nomes', 'reveal')}</div>${ranking}<div class="notice top-space"><p><b>Cada plano conta só nas perguntas em que ele tem posição.</b> Por isso o total muda de um plano para outro.</p><p>Um plano com poucas posições pode ter um número alto por sorte. Para evitar isso, a conta é (iguais + 1) ÷ (total + 2).</p><p>Em ${comp.differentiating} das suas respostas, os planos escolhem lados diferentes. São essas respostas que separam os candidatos.</p><p class="small">A sua certeza não muda a conta.</p></div></section>`;
}
function positionCard(item, c) {
  const p = QuizCore.position(item, c.key);
  const explicit = p.status === 'explicit';
  const relation = explicit && QuizCore.decided(resp[item.id]) ? (p.side===resp[item.id].choice ? 'Escolheu igual a você' : 'Escolheu diferente de você') : '';
  const status = explicit ? 'Posição clara' : p.status==='mixed' ? 'Fala do tema, mas não escolhe lado' : 'Não fala do tema';
  return `<article class="position"><span class="badge${relation==='Escolheu igual a você'?' accent':relation?' warm':''}">${esc(relation || status)}</span><strong>${esc(planName(c))}</strong><p>${explicit ? esc(item.options[p.side].action) : esc(status)}</p>${button('Ver evidência', 'evidence', `data-id="${item.id}" data-key="${c.key}"`)}</article>`;
}
function responseRow(item, index, comp) {
  const answer=resp[item.id], chosen=QuizCore.decided(answer)?item.options[answer.choice]:null;
  const scored = item.kind==='proposal' || (item.kind==='scenario' && !item.baseId && item.valuePositions);
  const counted = DATA.candidates.filter(c=>QuizCore.comparable(item,c.key));
  let inclusion='';
  if(!scored) inclusion='Esta pergunta só mostra se você muda de ideia. Ela não conta para os candidatos.';
  else if(!QuizCore.decided(answer)) inclusion='Não conta: você não escolheu um lado.';
  else inclusion=counted.length?`Conta para: ${counted.map(c=>esc(planName(c))).join(', ')}.`:'Nenhum plano tem posição clara aqui. Não conta para ninguém.';
  return `<details class="response-row" data-item="${item.id}"><summary><span class="row-index">${String(index+1).padStart(2,'0')}</span><span class="row-title">${esc(item.title)}<span class="row-subtitle">${esc(answerLabel(item,answer))}${chosen?' · '+confidenceLabel(answer):''}</span></span></summary><div class="response-content"><p class="small muted">${esc(item.context)}</p><div class="your-choice top-space"><strong>Sua resposta: ${esc(answerLabel(item,answer))}</strong>${chosen?`<p>${esc(chosen.action)}</p><p><b>O que você perde:</b> ${esc(chosen.cost)}</p>`:''}</div>${scored?`<div class="positions">${DATA.candidates.map(c=>positionCard(item,c)).join('')}</div>`:''}<p class="small muted top-space">${inclusion}</p><div class="top-space">${button('Revisar esta resposta','edit',`data-id="${item.id}"`)}</div></div></details>`;
}
function responseExplorer(comp) {
  const visible=DATA.items.filter(i=>filter==='all'||filter===i.kind||filter==='open'&&!QuizCore.decided(resp[i.id]));
  return `<section class="card" id="temas" aria-labelledby="explore-title"><div class="section-head"><div><p class="eyebrow">Suas respostas</p><h2 id="explore-title" class="top-space">Veja pergunta por pergunta</h2><p class="small muted">Toque numa pergunta para ver o que cada plano diz. Você também pode mudar a resposta.</p></div></div><div class="filterbar" role="group" aria-label="Filtrar respostas">${[['all','Todas'],['proposal','Propostas'],...(cases.length?[['scenario','Situações imaginadas']]:[]),['open','Sem resposta']].map(([v,t])=>`<button type="button" class="pill" data-filter="${v}" aria-pressed="${filter===v}">${t}</button>`).join('')}</div><div class="response-list">${visible.length?visible.map(i=>responseRow(i,DATA.items.indexOf(i),comp)).join(''):'<p class="empty">Nenhuma pergunta aqui.</p>'}</div></section>`;
}
function result(keepPosition=false) {
  const summary=QuizCore.progress(DATA.items,resp);
  if(summary.missing.length){pending(summary);return;}
  screen='result';editing=false;idx=DATA.items.length;
  track('done');
  const comp=QuizCore.compare(DATA,resp);
  app.innerHTML=`<div class="stack"><section class="card result-hero"><p class="eyebrow">Seu resultado</p><h1 tabindex="-1">${leaderHeadline(comp).title}</h1><p class="lead">${leaderHeadline(comp).text}</p><div class="stats"><div class="stat"><strong>${summary.decided}</strong><span>perguntas com A ou B</span></div><div class="stat"><strong>${summary.undecided}</strong><span>sem escolha</span></div><div class="stat"><strong>${summary.info}</strong><span>faltou informação</span></div><div class="stat"><strong>${comp.total}</strong><span>perguntas comparadas com os planos</span></div></div><nav class="actions top-space" aria-label="Seções do resultado"><a class="button quiet" href="#planos">Ver os três candidatos ↓</a>${cases.length?'<a class="button quiet" href="#valores">O que você priorizou ↓</a>':''}<a class="button quiet" href="#temas">Ver pergunta por pergunta ↓</a></nav></section>
  ${comparisonPanel(comp)}
  ${cases.length?`<section class="card" id="valores"><div class="section-head"><div><p class="eyebrow">Seu perfil de valores</p><h2 class="top-space">O que você protegeu nas situações difíceis</h2><p class="small muted">São cinco situações imaginadas. Em duas delas, uma coisa muda. Assim você vê se muda de ideia.</p></div></div><div class="scenario-grid">${cases.map(valueCard).join('')}</div></section>`:''}
  ${responseExplorer(comp)}
  <section class="card method"><details><summary>Como a conta é feita</summary><ol><li>Todas as perguntas vêm de propostas dos planos de governo. Um plano só recebe posição quando o texto dele escolhe um lado com clareza.</li><li>Cada posição mostra o trecho exato do plano e a linha onde ele está. Se o plano não fala do tema, ele não recebe posição.</li><li>Cada plano conta só nas perguntas em que ele tem posição. A conta é (escolhas iguais + 1) ÷ (total + 2). Assim, um plano com poucas posições não chega a 0% ou 100% por sorte.</li><li>Para mostrar o candidato mais parecido, cada plano precisa de pelo menos três perguntas comparadas. Se dois empatam, o quiz mostra o empate.</li><li>A sua certeza não muda a conta. "Não consigo escolher" e "Faltam informações" não contam. O quiz só mostra perguntas em que os planos escolhem lados diferentes. Perguntas em que os três escolhem o mesmo lado ficaram de fora.</li></ol><p>${TELEMETRY_URL ? 'O quiz conta visitas e em que pergunta as pessoas param, sem cookies e sem guardar endereço de internet. As respostas só são somadas se você tocar em "Enviar minhas respostas". ' : ''}Os planos vêm dos arquivos desta pasta. O quiz não garante que eles são a versão oficial do TSE. Os trechos ficam dentro deste arquivo. O PDF completo só abre se a pasta original estiver junto.</p><p>Os nomes ficam escondidos durante as perguntas. Assim o nome não influencia a sua resposta. Algumas propostas podem mostrar quem é o autor.</p></details></section>
  ${shareCard()}<section class="card"><h2>E agora?</h2><p class="muted small top-space">Você pode mudar qualquer resposta acima. O resultado muda junto.</p><div class="actions top-space">${button('Copiar resumo','copy','',true)}${button('Começar de novo','reset')}</div><div id="copy-feedback" aria-live="polite"></div></section></div>`;
  if(!keepPosition) focusMain();
}
function showEvidence(id,key) {
  const item=findItem(id), c=candidate(key);
  const p=item && c ? QuizCore.position(item,c.key) : null, dialog=document.getElementById('evidence-dialog');
  if(!p) return;
  const close=button('Fechar','close-dialog');
  if(!revealed) {
    dialog.innerHTML=`<div class="dialog-head"><h2 id="evidence-title">O trecho mostra quem escreveu o plano</h2>${close}</div><p>Para ver o trecho, o quiz precisa mostrar os nomes. Suas respostas continuam salvas.</p><div class="top-space">${button('Mostrar nomes e abrir o trecho','reveal-source',`data-id="${id}" data-key="${key}"`,true)}</div>`;
  } else {
    const source=p.source;
    dialog.innerHTML=`<div class="dialog-head"><div><p class="eyebrow">${esc(planName(c))}</p><h2 id="evidence-title">${esc(item.title)}</h2></div>${close}</div><span class="badge">${p.status==='explicit'?'Posição clara':p.status==='mixed'?'Fala do tema, mas não escolhe lado':'Não fala do tema'}</span><p class="top-space"><b>Como lemos o trecho:</b> ${esc(p.reason)}</p>${source?`<blockquote class="source-quote">${esc(p.quote)}</blockquote><p class="source-meta">${esc(source.file)} · linhas ${source.start}–${source.end} · página ${source.page} do PDF local</p><details class="top-space"><summary>Ver o texto em volta</summary><pre class="source-text">${esc(source.excerpt)}</pre></details><p class="top-space"><a href="_trabalho/${esc(source.file.replace(/\.txt$/,'.pdf'))}#page=${source.page}" target="_blank" rel="noopener">Abrir o PDF ↗</a></p><p class="source-meta top-space">O PDF só abre se a pasta original estiver junto com este arquivo.</p>`:'<p class="notice top-space">O plano não tem posição clara sobre esta pergunta. Por isso ele não conta aqui.</p>'}`;
  }
  if(!dialog.open) dialog.showModal();
}
function shareCard() {
  if (!TELEMETRY_URL) return '';
  if (answersSent) return '<section class="card" id="enviar"><h2>Obrigado!</h2><p class="muted top-space">Suas respostas foram somadas de forma anônima.</p></section>';
  return `<section class="card" id="enviar"><h2>Ajude a melhorar o quiz</h2><p class="top-space">Você pode enviar suas respostas de forma anônima. Elas ajudam a achar perguntas confusas e a melhorar o quiz.</p><ul class="small muted top-space"><li>Enviamos só as suas escolhas (A, B ou sem escolha) e o candidato mais parecido.</li><li>Não enviamos nome, telefone ou e-mail. Não usamos cookies. O servidor não guarda seu endereço de internet.</li><li>Só somamos contadores. Ninguém consegue ver as respostas de uma pessoa.</li></ul><div class="actions top-space">${button('Enviar minhas respostas', 'send-answers', '', true)}</div><p class="small muted top-space">Se você não tocar no botão, nada é enviado.</p></section>`;
}
function sendAnswers() {
  if (answersSent || !TELEMETRY_URL) return;
  const comp = QuizCore.compare(DATA, resp);
  beacon('/r', QuizCore.answersPayload(DATA.items, resp, comp.leaders));
  answersSent = true;
  result(true);
  announce('Respostas enviadas. Obrigado!');
}
function copyText() {
  const comp=QuizCore.compare(DATA,resp), summary=QuizCore.progress(DATA.items,resp);
  const head=leaderHeadline(comp).title.replace(/<[^>]+>/g,'');
  const rankings=comp.sufficient ? comp.ranking.map(r=>`${planName(candidate(r.key))}: ${r.percent}% (${r.matches} de ${r.total} escolhas no mesmo lado).`).join('\n') : 'Base insuficiente para apontar um candidato.';
  return `Entre escolhas — planos de governo 2026\n${head}\n\n${rankings}\n\n${summary.decided} perguntas com A ou B; ${summary.undecided} em aberto; ${summary.info} com informação insuficiente. Cada plano é comparado nas escolhas em que tem posição clara no documento.`;
}
async function copyResult() {
  track('copy');
  const text=copyText(), feedback=document.getElementById('copy-feedback');
  try {
    if(!navigator.clipboard?.writeText) throw new Error('Clipboard indisponível');
    await navigator.clipboard.writeText(text);
    feedback.innerHTML='<p class="copy-feedback">Resumo copiado.</p>';
  } catch {
    feedback.innerHTML=`<label class="small top-space" for="copy-text">Selecione e copie o resumo:</label><textarea id="copy-text" class="copy-area" readonly>${esc(text)}</textarea>`;
    document.getElementById('copy-text')?.select?.();
  }
}
function resetQuiz() { for(const key of Object.keys(resp)) delete resp[key]; answersSent=false; seen.clear(); revealed=false;filter='all';editOriginal=null;intro();focusMain(); }
function handleClick(event) {
  const target=event.target.closest?.('button');
  if(!target || target.disabled) return;
  const {choice,confidence,filter:nextFilter,action,id,key}=target.dataset;
  if(choice){pick(choice);return;}
  if(confidence){setConfidence(confidence);return;}
  if(nextFilter){filter=nextFilter;result(true);app.querySelector(`[data-filter="${filter}"]`)?.focus({preventScroll:true});return;}
  switch(action){
    case 'start':go(0);break;
    case 'back':go(idx-1);break;
    case 'next':if(editing){if(QuizCore.validAnswer(resp[DATA.items[idx].id])) result();}else go(idx+1);break;
    case 'edit':editQuestion(id);break;
    case 'cancel-edit':cancelEdit();break;
    case 'reveal':revealed=!revealed;result(true);app.querySelector('[data-action="reveal"]')?.focus({preventScroll:true});break;
    case 'evidence':showEvidence(id,key);break;
    case 'close-dialog':document.getElementById('evidence-dialog').close();break;
    case 'reveal-source':revealed=true;result(true);showEvidence(id,key);break;
    case 'copy':copyResult();break;
    case 'send-answers':sendAnswers();break;
    case 'reset':resetQuiz();break;
  }
}
app.addEventListener?.('click',handleClick);
document.getElementById('evidence-dialog').addEventListener?.('click',handleClick);
intro();

  </script>
